[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbi-simulation"
version = "0.1.0"
description = "CBI interlocking simulation and editor"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.14",
  "types-networkx>=3.5",
]

[tool.setuptools.packages.find]
include = [
  "config*",
  "core*",
  "infrastructure*",
  "integration*",
  "kernel*",
  "runtime*",
  "simulation*",
  "ui*",
]
exclude = [
  "data*",
  "tests*",
  "webclient*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"ui/i18n.py" = ["E501"]
"webclient/serve.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "call-overload",
  "method-assign",
  "misc",
  "no-any-return",
  "override",
  "return-value",
  "str-bytes-safe",
  "union-attr",
  "var-annotated",
]
exclude = '''(?x)(
    ^tests[\\/]
  | ^ui[\\/]
  | ^webclient[\\/]
)'''

